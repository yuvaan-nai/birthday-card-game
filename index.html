<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Card Game</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden;}
        #game-container { position: relative; width: 800px; height: 600px; }
        canvas { border: 4px solid #fff; background: #4a90e2; }
        
        /* QUEST TRACKER UI TAB */
        #quest-tracker {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 30, 0.85);
            border: 2px solid #f1c40f;
            border-radius: 20px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 10;
        }
        #quest-label {
            font-size: 11px;
            font-weight: bold;
            color: #f1c40f;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #quest-text {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        /* DIALOGUE UI */
        #ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px; width: 80%; display: none; pointer-events: none; z-index: 10;}
        #dialogue-text { font-size: 18px; margin-bottom: 5px; }
        #prompt { font-size: 12px; color: #aaa; text-align: right;}
    </style>
</head>
<body>

<div id="game-container">
    <!-- QUEST TRACKER TAB -->
    <div id="quest-tracker">
        <span id="quest-label">Objective:</span>
        <span id="quest-text">Talk to the villager</span>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui">
        <div id="dialogue-text"></div>
        <div id="prompt">Press SPACE to continue</div>
    </div>
</div>

<script>
// --- CONSTANTS & SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const PLAYER_SPEED = 3.5;

// --- DIALOGUE UI REFERENCES (DEFINED EARLY) ---
const uiElement = document.getElementById('ui');
const dialogueTextElement = document.getElementById('dialogue-text');

// --- STATE MANAGEMENT ---
let gameState = {
    currentScene: 'overworld',
    isDialogueActive: false,
    currentDialoguePartner: null,
    questStep: 0, 
    hasCake: false,
    cakePlaced: false,
    collectedGiftsCount: 0,
    totalGifts: 6,
    hasCat: false,
    gameCompleted: false,
    visitedGiftShop: false
};

const quests = [
    "Talk to the villager",
    "Get the chocolate cake",
    "Put cake at home",
    "Get gifts",
    "Go to the cashier",
    "Talk to old lady outside the shop",
    "Find the cat",
    "Return the cat to the old lady",
    "Go back to house",
    "Surprise! Happy Birthday, Gaurav!"
];

function updateQuestUI() {
    const questTextEl = document.getElementById('quest-text');
    if (questTextEl) {
        if (gameState.gameCompleted) {
            questTextEl.innerText = "Surprise! Happy Birthday, Gaurav!";
        } else if (gameState.questStep === 3) {
            questTextEl.innerText = `Get gifts (${gameState.collectedGiftsCount}/${gameState.totalGifts})`;
        } else if (gameState.questStep >= quests.length) {
            questTextEl.innerText = "Surprise! Happy Birthday, Gaurav!";
        } else {
            questTextEl.innerText = quests[gameState.questStep] || "Surprise! Happy Birthday, Gaurav!";
        }
    }
}

// --- INPUT HANDLING ---
const keys = { up: false, down: false, left: false, right: false, space: false };
let spacePressedThisFrame = false;

window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
    if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    
    if (e.key === ' ' && !keys.space) {
        keys.space = true;
        spacePressedThisFrame = true;
    }
});

window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
    if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    if (e.key === ' ') {
        keys.space = false;
    }
});

// --- UTILITIES ---
function rectIntersect(r1, r2) {
    return !(r2.x > r1.x + r1.w || 
             r2.x + r2.w < r1.x || 
             r2.y > r1.y + r1.h || 
             r2.y + r2.h < r1.y);
}

// --- GAME OBJECTS & DATA ---

const player = {
    x: canvas.width / 2 - 10,
    y: canvas.height / 2,
    w: 20,
    h: 20,
    color: '#6e4433',       
    hairColor: '#191516',   
    suitColor: '#1d2a44',   
    shirtColor: '#ffffff',  
    tieColor: '#5c4632',    
    hasPartyHat: false,
    updateSize: function() {
        if (gameState.currentScene === 'overworld') {
            this.w = 20;
            this.h = 20;
        } else {
            this.w = 40;
            this.h = 40;
        }
    },
    draw: function() {
        this.updateSize();
        
        ctx.fillStyle = this.suitColor;
        ctx.fillRect(this.x, this.y + (this.h * 0.65), this.w, this.h * 0.35);

        ctx.fillStyle = this.shirtColor;
        ctx.beginPath();
        ctx.moveTo(this.x + (this.w * 0.3), this.y + (this.h * 0.65));
        ctx.lineTo(this.x + (this.w * 0.5), this.y + (this.h * 0.9));
        ctx.lineTo(this.x + (this.w * 0.7), this.y + (this.h * 0.65));
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = this.tieColor;
        ctx.fillRect(this.x + (this.w * 0.44), this.y + (this.h * 0.68), this.w * 0.12, this.h * 0.25);

        ctx.fillStyle = this.color;
        ctx.fillRect(this.x + (this.w * 0.12), this.y + (this.h * 0.15), this.w * 0.76, this.h * 0.55);

        ctx.fillStyle = this.hairColor;
        ctx.fillRect(this.x + (this.w * 0.08), this.y - (this.h * 0.08), this.w * 0.84, this.h * 0.28);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x + (this.w * 0.2), this.y + (this.h * 0.16), this.w * 0.6, this.h * 0.04);

        ctx.fillStyle = '#111111';
        ctx.fillRect(this.x + (this.w * 0.22), this.y + (this.h * 0.25), this.w * 0.22, Math.max(1, this.h * 0.04));
        ctx.fillRect(this.x + (this.w * 0.56), this.y + (this.h * 0.25), this.w * 0.22, Math.max(1, this.h * 0.04));

        const eyeSize = Math.max(2, this.w * 0.1);
        const eyeY = this.y + (this.h * 0.32);
        const leftEyeX = this.x + (this.w * 0.25);
        const rightEyeX = this.x + (this.w * 0.65) - eyeSize;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(leftEyeX, eyeY, eyeSize, eyeSize);
        ctx.fillRect(rightEyeX, eyeY, eyeSize, eyeSize);
        
        ctx.fillStyle = '#111111';
        ctx.fillRect(leftEyeX + (eyeSize * 0.2), eyeY + (eyeSize * 0.2), eyeSize * 0.7, eyeSize * 0.7);
        ctx.fillRect(rightEyeX + (eyeSize * 0.2), eyeY + (eyeSize * 0.2), eyeSize * 0.7, eyeSize * 0.7);

        ctx.fillStyle = this.hairColor;
        ctx.fillRect(this.x + (this.w * 0.08), this.y + (this.h * 0.12), this.w * 0.1, this.h * 0.45);
        ctx.fillRect(this.x + (this.w * 0.82), this.y + (this.h * 0.12), this.w * 0.1, this.h * 0.45);
        ctx.fillRect(this.x + (this.w * 0.12), this.y + (this.h * 0.45), this.w * 0.76, this.h * 0.24);
        ctx.fillRect(this.x + (this.w * 0.25), this.y + (this.h * 0.42), this.w * 0.5, this.h * 0.07);

        const smileW = this.w * 0.38;
        const smileH = this.h * 0.12;
        const smileX = this.x + (this.w / 2) - (smileW / 2);
        const smileY = this.y + (this.h * 0.48);

        ctx.fillStyle = '#4a151b';
        ctx.fillRect(smileX, smileY, smileW, smileH);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(smileX + (smileW * 0.05), smileY, smileW * 0.9, smileH * 0.55);

        if (this.hasPartyHat) {
            const isIndoor = gameState.currentScene !== 'overworld';
            const hatHeight = isIndoor ? 24 : 14;
            const hatWidth = this.w;
            const tipX = this.x + (this.w / 2);
            const tipY = this.y - (this.h * 0.15) - hatHeight;

            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - (this.h * 0.15));
            ctx.lineTo(tipX, tipY);
            ctx.lineTo(this.x + hatWidth, this.y - (this.h * 0.15));
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(tipX, tipY, isIndoor ? 4 : 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = isIndoor ? 'bold 11px sans-serif' : 'bold 7px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("40!", tipX, tipY + (hatHeight * 0.55));
            ctx.textAlign = 'left'; 
            ctx.textBaseline = 'alphabetic';
        }
    }
};

function drawVillager(npc) {
    const isIndoor = gameState.currentScene !== 'overworld';
    const scale = isIndoor ? 2 : 1;
    const w = npc.w * scale;
    const h = npc.h * scale;
    const x = npc.x;
    const y = npc.y;

    if (npc.id === 'oldLady') {
        ctx.fillStyle = '#9b59b6'; 
        ctx.fillRect(x, y + (h * 0.4), w, h * 0.6);
        ctx.fillStyle = '#ffdbac'; 
        ctx.fillRect(x + (w * 0.2), y + (h * 0.15), w * 0.6, h * 0.35);
        ctx.fillStyle = '#bdc3c7'; 
        ctx.fillRect(x + (w * 0.2), y, w * 0.6, h * 0.2);
        const eyeSize = Math.max(2, w * 0.1);
        ctx.fillStyle = '#333333';
        ctx.fillRect(x + (w * 0.3), y + (h * 0.25), eyeSize, eyeSize);
        ctx.fillRect(x + (w * 0.6), y + (h * 0.25), eyeSize, eyeSize);
        return;
    }

    ctx.fillStyle = '#d2b48c'; 
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = npc.id === 'baker' ? '#ffffff' : (npc.id === 'cashier' ? '#2980b9' : '#5c4033');
    ctx.fillRect(x, y + (h * 0.6), w, h * 0.15);
    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(x + (w * 0.4), y + (h * 0.6), w * 0.2, h * 0.15);

    ctx.fillStyle = '#ffdbac';
    ctx.fillRect(x + (w * 0.2), y + (h * 0.2), w * 0.6, h * 0.35);

    const eyeSize = Math.max(2, w * 0.1);
    ctx.fillStyle = '#333333';
    ctx.fillRect(x + (w * 0.3), y + (h * 0.3), eyeSize, eyeSize);
    ctx.fillRect(x + (w * 0.6), y + (h * 0.3), eyeSize, eyeSize);

    if (npc.id === 'baker') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x + (w * 0.1), y - (h * 0.25), w * 0.8, h * 0.35);
        ctx.fillRect(x - (w * 0.1), y - (h * 0.5), w * 1.2, h * 0.3);
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - (w * 0.1), y - (h * 0.5), w * 1.2, h * 0.3);
    } else if (npc.id === 'cashier') {
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(x + (w * 0.1), y - (h * 0.15), w * 0.8, h * 0.2);
    } else {
        ctx.fillStyle = '#c2b280'; 
        ctx.fillRect(x - (w * 0.15), y + (h * 0.15), w * 1.3, h * 0.12);
        ctx.fillStyle = '#a69460'; 
        ctx.fillRect(x + (w * 0.15), y - (h * 0.1), w * 0.7, h * 0.28);
    }
}

const glassDisplay = { x: 250, y: 220, w: 300, h: 70 };

function drawRedCarpet() {
    const carpetX = 350;
    const carpetY = 285;
    const carpetW = 100;
    const carpetH = 290;

    ctx.fillStyle = '#c0392b';
    ctx.fillRect(carpetX, carpetY, carpetW, carpetH);

    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(carpetX, carpetY, 6, carpetH);
    ctx.fillRect(carpetX + carpetW - 6, carpetY, 6, carpetH);

    for (let i = carpetY; i < carpetY + carpetH; i += 18) {
        ctx.fillRect(carpetX - 2, i, 4, 8);
        ctx.fillRect(carpetX + carpetW - 2, i, 4, 8);
    }
}

function drawSingleCake(cx, cy, scale = 1, baseColor = '#f5e0c3', frostingColor = '#e91e63') {
    const cw = 28 * scale;
    const ch = 20 * scale;

    ctx.fillStyle = baseColor; 
    ctx.fillRect(cx, cy, cw, ch);
    
    ctx.fillStyle = frostingColor; 
    ctx.fillRect(cx, cy, cw, 6 * scale);
    ctx.fillRect(cx, cy + (10 * scale), cw, 3 * scale);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx + (cw/2) - 2, cy - (8 * scale), 4 * scale, 8 * scale);
    ctx.fillStyle = '#ff9800'; 
    ctx.fillRect(cx + (cw/2) - 3, cy - (12 * scale), 6 * scale, 4 * scale);
}

function drawSingleGiftBox(gx, gy, size = 20, boxColor = '#e74c3c', ribbonColor = '#f1c40f') {
    ctx.fillStyle = boxColor;
    ctx.fillRect(gx, gy, size, size);
    ctx.fillStyle = ribbonColor;
    ctx.fillRect(gx + size/2 - 3, gy, 6, size);
    ctx.fillRect(gx, gy + size/2 - 3, size, 6);
}

function drawPottedPlant(x, y) {
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(x, y + 15, 24, 20);
    ctx.fillStyle = '#962d22';
    ctx.fillRect(x - 2, y + 12, 28, 6);

    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.arc(x + 12, y + 8, 14, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.arc(x + 6, y + 4, 9, 0, Math.PI * 2);
    ctx.arc(x + 18, y + 6, 8, 0, Math.PI * 2);
    ctx.fill();
}

function drawBakeryDiningTables() {
    const tables = [
        { x: 100, y: 120 }, { x: 600, y: 120 },
        { x: 100, y: 440 }, { x: 600, y: 440 }
    ];
    tables.forEach(t => {
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(t.x, t.y, 70, 70);
        ctx.strokeStyle = '#5c4033';
        ctx.lineWidth = 3;
        ctx.strokeRect(t.x, t.y, 70, 70);

        ctx.fillStyle = '#d7ccc8';
        ctx.beginPath();
        ctx.arc(t.x + 35, t.y + 35, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#5c4033';
        ctx.fillRect(t.x + 25, t.y - 12, 20, 12);
        ctx.fillRect(t.x + 25, t.y + 70, 20, 12);
        ctx.fillRect(t.x - 12, t.y + 25, 12, 20);
        ctx.fillRect(t.x + 70, t.y + 25, 12, 20);
    });
}

function drawGlassDisplayShelf() {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.fillRect(glassDisplay.x, glassDisplay.y, glassDisplay.w, glassDisplay.h);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.strokeRect(glassDisplay.x, glassDisplay.y, glassDisplay.w, glassDisplay.h);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(glassDisplay.x, glassDisplay.y + glassDisplay.h - 10, glassDisplay.w, 10);

    drawSingleCake(glassDisplay.x + 20, glassDisplay.y + 10, 0.75, '#f5e0c3', '#e91e63');
    drawSingleCake(glassDisplay.x + 75, glassDisplay.y + 10, 0.75, '#8d5524', '#ffffff');
    drawSingleCake(glassDisplay.x + 130, glassDisplay.y + 10, 0.75, '#ffeb3b', '#9c27b0');
    drawSingleCake(glassDisplay.x + 185, glassDisplay.y + 10, 0.75, '#ff7043', '#4caf50');
    drawSingleCake(glassDisplay.x + 240, glassDisplay.y + 10, 0.75, '#9c27b0', '#ffeb3b');

    if (!gameState.hasCake) {
        drawSingleCake(glassDisplay.x + 125, glassDisplay.y + 35, 1, '#4a2511', '#8b4513');
    }
}

const houseTableLeft = { x: 70, y: 100, w: 80, h: 320 };
const houseTableRight = { x: 650, y: 100, w: 80, h: 320 };
const houseTableBack = { x: 360, y: 80, w: 80, h: 50 };
const pottedPlants = [
    { x: 35, y: 45 },
    { x: 730, y: 45 },
    { x: 730, y: 515 }
];

function drawPartyDecorations() {
    const colors = ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71', '#9b59b6', '#e67e22'];
    for (let i = 40; i < canvas.width - 40; i += 30) {
        ctx.fillStyle = colors[(i / 30) % colors.length | 0];
        ctx.beginPath();
        ctx.moveTo(i, 20);
        ctx.lineTo(i + 15, 40);
        ctx.lineTo(i + 30, 20);
        ctx.closePath();
        ctx.fill();
    }

    const balloons = [
        { x: 50, y: 180, color: '#e74c3c' },
        { x: 60, y: 220, color: '#3498db' },
        { x: 730, y: 180, color: '#f1c40f' },
        { x: 740, y: 220, color: '#2ecc71' }
    ];
    balloons.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + 14);
        ctx.lineTo(b.x, b.y + 45);
        ctx.stroke();
    });
}

function drawHouseInterior() {
    if (gameState.visitedGiftShop) {
        drawPartyDecorations();
    }

    ctx.fillStyle = '#5c4033';
    ctx.fillRect(houseTableLeft.x - 18, houseTableLeft.y + 140, 14, 50); 
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(houseTableLeft.x, houseTableLeft.y, houseTableLeft.w, houseTableLeft.h);
    ctx.strokeStyle = '#5c4033';
    ctx.lineWidth = 2;
    ctx.strokeRect(houseTableLeft.x, houseTableLeft.y, houseTableLeft.w, houseTableLeft.h);

    if (gameState.visitedGiftShop) {
        drawSingleGiftBox(houseTableLeft.x + 10, houseTableLeft.y + 20, 22, '#e74c3c', '#f1c40f');
        drawSingleGiftBox(houseTableLeft.x + 45, houseTableLeft.y + 30, 26, '#3498db', '#ffffff');
        drawSingleGiftBox(houseTableLeft.x + 20, houseTableLeft.y + 80, 20, '#2ecc71', '#e74c3c');
        drawSingleGiftBox(houseTableLeft.x + 40, houseTableLeft.y + 130, 24, '#9b59b6', '#f1c40f');
        drawSingleGiftBox(houseTableLeft.x + 15, houseTableLeft.y + 180, 28, '#e67e22', '#3498db');
        drawSingleGiftBox(houseTableLeft.x + 42, houseTableLeft.y + 230, 22, '#1abc9c', '#ffffff');
    }

    ctx.fillStyle = '#5c4033';
    ctx.fillRect(houseTableRight.x + houseTableRight.w + 4, houseTableRight.y + 140, 14, 50); 
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(houseTableRight.x, houseTableRight.y, houseTableRight.w, houseTableRight.h);
    ctx.strokeRect(houseTableRight.x, houseTableRight.y, houseTableRight.w, houseTableRight.h);

    if (gameState.visitedGiftShop) {
        drawSingleGiftBox(houseTableRight.x + 12, houseTableRight.y + 25, 24, '#f39c12', '#9b59b6');
        drawSingleGiftBox(houseTableRight.x + 44, houseTableRight.y + 35, 20, '#e74c3c', '#2ecc71');
        drawSingleGiftBox(houseTableRight.x + 18, houseTableRight.y + 90, 26, '#34495e', '#f1c40f');
        drawSingleGiftBox(houseTableRight.x + 40, houseTableRight.y + 140, 22, '#d35400', '#ffffff');
        drawSingleGiftBox(houseTableRight.x + 15, houseTableRight.y + 190, 25, '#2980b9', '#e74c3c');
        drawSingleGiftBox(houseTableRight.x + 42, houseTableRight.y + 240, 20, '#27ae60', '#f1c40f');
    }

    ctx.fillStyle = '#5c4033';
    ctx.fillRect(houseTableBack.x + 30, houseTableBack.y - 20, 20, 14); 
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(houseTableBack.x, houseTableBack.y, houseTableBack.w, houseTableBack.h);
    ctx.strokeRect(houseTableBack.x, houseTableBack.y, houseTableBack.w, houseTableBack.h);

    if (gameState.hasCake && !gameState.cakePlaced) {
        ctx.fillStyle = 'rgba(241, 196, 15, 0.4)';
        ctx.fillRect(houseTableBack.x + 20, houseTableBack.y + 10, 40, 30);
        ctx.fillStyle = '#fff';
        ctx.font = '10px sans-serif';
        ctx.fillText("Place Cake", houseTableBack.x + 12, houseTableBack.y - 5);
    } else if (gameState.cakePlaced) {
        drawSingleCake(houseTableBack.x + 26, houseTableBack.y + 10, 1, '#4a2511', '#8b4513');
    }

    pottedPlants.forEach(plant => {
        drawPottedPlant(plant.x, plant.y);
    });

    if (gameState.visitedGiftShop) {
        const crowdPeople = [
            { x: 220, y: 150, suitColor: '#d35400', hairColor: '#2c3e50', hat: true },
            { x: 550, y: 150, suitColor: '#2980b9', hairColor: '#7f8c8d', hat: true },
            { x: 200, y: 350, suitColor: '#8e44ad', hairColor: '#d35400', hat: true },
            { x: 570, y: 350, suitColor: '#27ae60', hairColor: '#111111', hat: true },
            { x: 300, y: 420, suitColor: '#c0392b', hairColor: '#f1c40f', hat: true },
            { x: 480, y: 420, suitColor: '#16a085', hairColor: '#34495e', hat: true }
        ];

        crowdPeople.forEach(p => {
            ctx.fillStyle = p.suitColor;
            ctx.fillRect(p.x, p.y + 20, 30, 20);
            ctx.fillStyle = '#ffdbac';
            ctx.fillRect(p.x + 5, p.y + 5, 20, 20);
            ctx.fillStyle = p.hairColor;
            ctx.fillRect(p.x + 5, p.y + 3, 20, 6);
            if (p.hat) {
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();

    ctx.fillStyle = '#5c4033';

    ctx.fill();

    ctx.fillStyle = '#1a1a1a';

function update() {

    movePlayer();
    checkCollisions();
    checkInteractions();
    spacePressedThisFrame = false;
}

function draw() {

    if (gameState.currentScene === 'overworld') {
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#d7ccc8';
        ctx.fillRect(350, 0, 100, canvas.height);
        ctx.fillStyle = '#bcaaa4';
        ctx.fillRect(346, 0, 4, canvas.height);
        ctx.fillRect(450, 0, 4, canvas.height);
    } else {
        ctx.fillStyle = '#8d6e63'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        let displaySceneName = gameState.currentScene.toUpperCase();
        if (gameState.currentScene === 'hut1') displaySceneName = 'BAKERY';
        if (gameState.currentScene === 'hut4') displaySceneName = 'GIFT SHOP';
        if (gameState.currentScene === 'hut6') displaySceneName = 'HOUSE';
        if (gameState.currentScene === 'hut3') displaySceneName = "OLD LADY'S HOUSE";

        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(10, 10, 240, 35);
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.fillText(`Inside: ${displaySceneName}`, 20, 33);
    }

    const currentObs = world.obstacles[gameState.currentScene] || world.obstacles.interior;
    currentObs.forEach(obs => {
        if (obs.color) {
            ctx.fillStyle = obs.color;
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        }
    });

    if (gameState.currentScene === 'overworld') {
        smallHuts.forEach(hut => drawHut(hut));
    }

        drawRedCarpet();
        drawBakeryDiningTables();

    }

            ctx.fillStyle = door.color;

function gameLoop() {

// --- LOGIC SUBSYSTEMS ---

function movePlayer() {
    player.updateSize();
    let nextX = player.x;
    let nextY = player.y;

    if (keys.up) nextY -= PLAYER_SPEED;
    if (keys.down) nextY += PLAYER_SPEED;
    if (keys.left) nextX -= PLAYER_SPEED;
    if (keys.right) nextX += PLAYER_SPEED;

    nextX = Math.max(0, Math.min(canvas.width - player.w, nextX));
    nextY = Math.max(0, Math.min(canvas.height - player.h, nextY));

    let collision = false;
    const currentObstacles = world.obstacles[gameState.currentScene] || world.obstacles.interior;
    for (let obs of currentObstacles) {
        if (rectIntersect({x: nextX, y: nextY, w: player.w, h: player.h}, obs)) {
            collision = true;
            break;
        }
    }

    if (!collision) {
        player.x = nextX;
        player.y = nextY;
    }
}

function checkCollisions() {
    world.doors.forEach(door => {
        if (door.currentScene === gameState.currentScene && rectIntersect(player, door)) {
            if (door.targetScene === 'hut4') {
                gameState.visitedGiftShop = true;
            }

            if (door.targetScene === 'hut6' && gameState.questStep === 8) {
                gameState.gameCompleted = true;
                updateQuestUI();
            }

            gameState.currentScene = door.targetScene;
            player.x = door.entrySpawn.x;
            player.y = door.entrySpawn.y;
        }
    });
}

function checkInteractions() {
    if (spacePressedThisFrame && !gameState.isDialogueActive) {
        if (gameState.currentScene === 'hut4') {
            for (let g of collectibleGifts) {
                if (!g.collected && rectIntersect(player, { x: g.x - 30, y: g.y - 30, w: g.w + 60, h: g.h + 60 })) {
                    g.collected = true;
                    gameState.collectedGiftsCount++;
                    updateQuestUI();
                    
                    if (gameState.questStep === 3 && gameState.collectedGiftsCount >= gameState.totalGifts) {
                        gameState.questStep = 4; 
                        updateQuestUI();
                    }
                    spacePressedThisFrame = false;
                    return;
                }
            }
        }

        if (gameState.currentScene === 'hut3' && gameState.questStep === 6 && !gameState.hasCat) {
            if (rectIntersect(player, { x: catObject.x - 30, y: catObject.y - 30, w: catObject.w + 60, h: catObject.h + 60 })) {
                gameState.hasCat = true;
                gameState.isDialogueActive = true;
                uiElement.style.display = 'block';
                
                gameState.currentDialoguePartner = {
                    name: "Cat",
                    dialogue: ["Meow! (You picked up the lost cat! Take it back to the old lady outside)"],
                    dialogueIndex: 0
                };
                showDialogueLine();

                gameState.questStep = 7; 
                updateQuestUI();
                spacePressedThisFrame = false;
                return;
            }
        }

        const currentNPCs = npcs[gameState.currentScene] || [];
        for (let npc of currentNPCs) {
            const interactRange = gameState.currentScene === 'hut1'
                ? { x: glassDisplay.x - 20, y: glassDisplay.y, w: glassDisplay.w + 40, h: glassDisplay.h + 50 }
                : { x: npc.x - 20, y: npc.y - 20, w: npc.w + 40, h: npc.h + 40 };

            if (rectIntersect(player, interactRange)) {
                startDialogue(npc);
                spacePressedThisFrame = false;
                return;
            }
        }

        if (gameState.currentScene === 'hut6' && gameState.hasCake && !gameState.cakePlaced) {
            const tableRange = { x: houseTableBack.x - 10, y: houseTableBack.y - 10, w: houseTableBack.w + 20, h: houseTableBack.h + 20 };
            if (rectIntersect(player, tableRange)) {
                gameState.cakePlaced = true;
                gameState.questStep = 3; 
                updateQuestUI();
                spacePressedThisFrame = false;
                return;
            }
        }
    }
}

function obtainCake() {
    gameState.hasCake = true;
    if (gameState.questStep === 1) {
        gameState.questStep = 2;
        updateQuestUI();
    }
}

// --- DIALOGUE SYSTEM ---
function startDialogue(npc) {
    gameState.isDialogueActive = true;
    gameState.currentDialoguePartner = npc;
    uiElement.style.display = 'block';
    
    if (npc.id === 'guide') {
        player.hasPartyHat = true;
        if (gameState.questStep === 0) {
            gameState.questStep = 1;
            updateQuestUI();
        }
    } else if (npc.id === 'baker') {
        obtainCake();
    } else if (npc.id === 'cashier') {
        if (gameState.questStep === 4) {
            npc.dialogue = ["Thank you for buying from the Gift Shop. Have a good day!"];
        } else {
            npc.dialogue = ["Welcome to the Gift Shop! Pick out all the gifts from the aisles and bring them here."];
        }
    } else if (npc.id === 'oldLady') {
        if (gameState.questStep === 5) {
            npc.dialogue = ["Can you find my cat? It wandered off into my house."];
        } else if (gameState.questStep === 7 && gameState.hasCat) {
            npc.dialogue = ["Oh thank goodness, you found my cat! You are a lifesaver, happy birthday!"];
        } else {
            npc.dialogue = ["Hi! Thanks for your help with everything."];
        }
    }

    showDialogueLine();
}

function showDialogueLine() {
    const npc = gameState.currentDialoguePartner;
    dialogueTextElement.innerText = `${npc.name}: ${npc.dialogue[npc.dialogueIndex]}`;
}

function handleDialogueUpdate() {
    if (spacePressedThisFrame) {
        const npc = gameState.currentDialoguePartner;
        npc.dialogueIndex++;
        
        if (npc.dialogueIndex >= npc.dialogue.length) {
            if (npc.id === 'cashier' && gameState.questStep === 4) {
                gameState.questStep = 5; 
                updateQuestUI();
            } else if (npc.id === 'oldLady' && gameState.questStep === 5) {
                gameState.questStep = 6; 
                updateQuestUI();
            } else if (npc.id === 'oldLady' && gameState.questStep === 7 && gameState.hasCat) {
                gameState.questStep = 8; 
                updateQuestUI();
            }
            endDialogue();
        } else {
            showDialogueLine();
        }
    }
}

function endDialogue() {
    gameState.isDialogueActive = false;
    const npc = gameState.currentDialoguePartner;
    uiElement.style.display = 'none';
    
    if (npc && npc.dialogueIndex !== undefined) {
        npc.dialogueIndex = 0;
    }
    gameState.currentDialoguePartner = null;
}

// --- INITIALIZE ---
updateQuestUI();
gameLoop();
